name: Build relay image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::975050199193:role/iptv-control-room-github
          aws-region: us-east-2
      - name: Install AWS CLI v2 and Lightsail image plugin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/aws/install" --update
          curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o "$RUNNER_TEMP/lightsailctl"
          chmod +x "$RUNNER_TEMP/lightsailctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build and push relay
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t "iptv-relay:${GITHUB_SHA}" ./control-room
          aws lightsail push-container-image --region us-east-2 --service-name iptv-control-room --label relay --image "iptv-relay:${GITHUB_SHA}"
          echo 'Relay image registered in Lightsail. Use the immutable image name from this step in the CDK deployment.' >> "$GITHUB_STEP_SUMMARY"
